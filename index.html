<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laptop</title>
<style>
:root{
  --night:#0F1B26; --dusk:#1E3440;
  --steel:#93A7B5; --bone:#ECE6DA;
  --shell-a:#2E4453; --shell-b:#16242E;
  --text:system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{background:#000}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

.pin{height:300vh;position:relative}
.stage{
  position:sticky;top:0;height:100svh;
  overflow:hidden;perspective:1700px;perspective-origin:50% 30%;
  background:radial-gradient(ellipse 80% 60% at 50% 78%,var(--dusk) 0%,var(--night) 55%,#000 100%);
  --ry:-38deg;--rx:-24deg;--lid:-90deg;--glow:0;--zoom:1;--s:1;
}
.spill{position:absolute;left:50%;top:48%;width:120vmin;height:90vmin;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,rgba(147,167,181,.28),rgba(47,85,99,.16) 40%,transparent 70%);
  opacity:var(--glow);pointer-events:none}
.floor{position:absolute;left:50%;top:66%;width:90vmin;height:14vmin;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(0,0,0,.6),transparent 70%);filter:blur(8px)}

.rig{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;
  transform:scale(calc(var(--s) * var(--zoom)))}
.laptop{position:absolute;transform-style:preserve-3d;
  transform:translateY(90px) rotateX(var(--rx)) rotateY(var(--ry)) translateZ(-190px)}
.base{position:absolute;left:-280px;top:0;width:560px;height:380px;transform-origin:50% 0;transform:rotateX(90deg);
  border-radius:8px 8px 26px 26px;
  background:linear-gradient(180deg,var(--shell-b),var(--shell-a) 60%,#3b5566);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.front{position:absolute;left:-280px;top:0;width:560px;height:11px;transform:translateZ(380px);
  border-radius:0 0 14px 14px;background:linear-gradient(90deg,#1a2a35,#5b7688 50%,#1a2a35)}
.front::after{content:"";position:absolute;left:50%;top:0;width:90px;height:4px;transform:translateX(-50%);background:rgba(0,0,0,.45);border-radius:0 0 6px 6px}
.hinge{position:absolute;left:-230px;top:-12px;width:460px;height:13px;border-radius:6px;background:linear-gradient(#0b1117,#1f2e39)}
.deck{position:absolute;left:38px;right:38px;top:28px;height:188px;display:grid;
  grid-template-columns:repeat(14,1fr);grid-auto-rows:1fr;gap:5px;padding:9px;border-radius:8px;background:rgba(0,0,0,.35)}
.deck i{border-radius:4px;background:#101920;box-shadow:inset 0 -1px 0 rgba(255,255,255,.05)}
.deck i.wide{grid-column:span 2}.deck i.space{grid-column:span 6}
.pad{position:absolute;left:50%;top:236px;width:210px;height:124px;transform:translateX(-50%);border-radius:10px;
  background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}

.lid{position:absolute;left:-280px;top:-390px;width:560px;height:380px;transform-origin:50% 100%;
  transform:rotateX(var(--lid));transform-style:preserve-3d}
.lid-front,.lid-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px 18px 6px 6px}
.lid-front{transform:translateZ(1px);background:#06090c;box-shadow:inset 0 0 0 2px #1d2c36}
.lid-back{transform:rotateY(180deg) translateZ(1px);
  background:linear-gradient(160deg,#3d5767,var(--shell-a) 35%,var(--shell-b));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

.display{position:absolute;left:14px;right:14px;top:14px;bottom:20px;border-radius:8px;overflow:hidden;background:#010203;cursor:pointer}
.display img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:var(--glow);display:block}
.display .drop{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:1rem;
  font-size:13px;line-height:1.5;color:var(--steel);opacity:var(--glow)}
.display.missing img{display:none}
.display.missing .drop{display:grid}
.cam{position:absolute;left:50%;top:5px;width:5px;height:5px;border-radius:50%;background:#1b2a33;transform:translateX(-50%)}

.hint{position:absolute;bottom:8vh;left:0;right:0;text-align:center;font-size:.9rem;color:var(--steel);
  opacity:calc(1 - var(--glow) * 4);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<section class="pin" aria-label="Laptop">
  <div class="stage" id="stage">
    <div class="spill"></div>
    <div class="floor"></div>
    <div class="rig">
      <div class="laptop">
        <div class="base"><div class="deck" id="deck"></div><div class="pad"></div></div>
        <div class="front"></div>
        <div class="hinge"></div>
        <div class="lid">
          <div class="lid-back"></div>
          <div class="lid-front">
            <span class="cam"></span>
            <div class="display" id="display" title="Click or drop a GIF to change it">
              <img id="gif" src="cat.gif" alt="Animated GIF of a tabby cat with its eyes closed">
              <div class="drop">Put your GIF next to this file and name it cat.gif,<br>or click here / drop it on the screen.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="hint">Scroll to open it</p>
    <input type="file" id="picker" accept="image/gif,image/*" class="sr" tabindex="-1">
  </div>
</section>

<script>
(function(){
  const stage=document.getElementById('stage');
  const pin=stage.parentElement;

  // keyboard deck
  const deck=document.getElementById('deck');
  let html='';
  for(let r=0;r<5;r++){
    if(r===0){for(let i=0;i<14;i++)html+='<i></i>';}
    else if(r===1){html+='<i class="wide"></i>';for(let i=0;i<12;i++)html+='<i></i>';}
    else if(r===2){html+='<i class="wide"></i>';for(let i=0;i<12;i++)html+='<i></i>';}
    else if(r===3){html+='<i class="wide"></i>';for(let i=0;i<10;i++)html+='<i></i>';html+='<i class="wide"></i>';}
    else {for(let i=0;i<4;i++)html+='<i></i>';html+='<i class="space"></i>';for(let i=0;i<4;i++)html+='<i></i>';}
  }
  deck.innerHTML=html;

  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const lerp=(a,b,t)=>a+(b-a)*t;

  function fit(){
    const s=Math.min(1,window.innerWidth/820,stage.clientHeight/760);
    stage.style.setProperty('--s',s.toFixed(3));
  }
  function update(){
    const total=pin.offsetHeight-stage.offsetHeight;
    const p=clamp(-pin.getBoundingClientRect().top/total,0,1);
    const spin=ease(seg(p,.0,.35));
    const open=ease(seg(p,.25,.7));
    const glow=ease(seg(p,.55,.8));
    const push=ease(seg(p,.7,1));
    stage.style.setProperty('--ry',(lerp(-38,0,spin)+lerp(0,-8,push)).toFixed(2)+'deg');
    stage.style.setProperty('--rx',lerp(-26,-16,push).toFixed(2)+'deg');
    stage.style.setProperty('--lid',lerp(-90,16,open).toFixed(2)+'deg');
    stage.style.setProperty('--glow',glow.toFixed(3));
    stage.style.setProperty('--zoom',lerp(1,1.14,push).toFixed(3));
  }
  let ticking=false;
  window.addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{update();ticking=false;});}},{passive:true});
  window.addEventListener('resize',()=>{fit();update();});
  fit();update();

  // GIF: loads cat.gif; if missing, let the person pick or drop one
  const display=document.getElementById('display');
  const gif=document.getElementById('gif');
  const picker=document.getElementById('picker');
  gif.addEventListener('error',()=>display.classList.add('missing'));
  function useFile(f){
    if(!f||!f.type.startsWith('image/'))return;
    gif.src=URL.createObjectURL(f);
    display.classList.remove('missing');
  }
  display.addEventListener('click',()=>{if(display.classList.contains('missing'))picker.click();});
  picker.addEventListener('change',()=>useFile(picker.files[0]));
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{e.preventDefault();useFile(e.dataTransfer.files[0]);});
})();
</script>
</body>
</html>
